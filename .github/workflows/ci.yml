name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cert_orchestrator_ci
          POSTGRES_USER: dcos
          POSTGRES_PASSWORD: changeme
          POSTGRES_INITDB_ARGS: "-c max_connections=10"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:3.12-alpine
        env:
          RABBITMQ_DEFAULT_USER: dcos
          RABBITMQ_DEFAULT_PASS: changeme
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

    env:
      CERT_ORCH_POSTGRES_HOST: localhost
      CERT_ORCH_POSTGRES_DB: cert_orchestrator_ci
      CERT_ORCH_RABBITMQ_HOST: localhost
      CERT_ORCH_BACKOFF_SECONDS: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests with coverage
        run: pytest --cov=cert_orchestrator --cov-report=xml --cov-report=term

      - name: New-code coverage (PRs only)
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=95

      - name: Migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: SonarCloud scan
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 30
